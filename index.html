<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>MaxFinder — places TGV Max</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MaxFinder">
<meta name="theme-color" content="#0f2a2e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png">
<style>
:root{
  --bg:#f3f1ec; --card:#ffffff; --ink:#132326; --mut:#6b7a7c; --line:#e2dfd6;
  --brand:#0f2a2e; --brandInk:#eaf6f2; --ok:#0b8f6a; --okBg:#dff5ec; --warn:#b26a00; --warnBg:#fdeccd;
  --off:#9aa5a6; --offBg:#eceae4; --acc:#e4572e; --r:16px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1517; --card:#14272b; --ink:#e9f1ef; --mut:#8fa3a5; --line:#21383c;
  --brand:#0b1f22; --acc:#ff7a52; --okBg:#0f3a2e; --ok:#47d6a6; --warnBg:#3b2c0e; --warn:#f0b24a; --offBg:#1b2c2f; --off:#6f8386;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
header{background:var(--brand);color:var(--brandInk);padding:calc(14px + env(safe-area-inset-top)) 18px 16px;position:sticky;top:0;z-index:5}
header .row{display:flex;align-items:center;gap:10px}
h1{font-size:20px;margin:0;letter-spacing:-.02em;flex:1}
h1 b{color:#5fe0b4}
.hbtn{font-size:13px;padding:7px 11px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--brandInk)}
.sub{font-size:12px;color:rgba(234,246,242,.72);margin-top:4px}
main{padding:14px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.od{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center}
.pick{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.pick small{display:block;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pick span{font-weight:600;font-size:17px}
.swap{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;font-size:18px;grid-row:span 2}
.tog{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:14px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--offBg);position:relative;flex:none;transition:.15s;border:1px solid var(--line)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.sw.on{background:var(--ok)} .sw.on::after{left:20px}
.alts{font-size:12px;color:var(--mut);margin-top:6px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 4px 8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;text-align:center;color:var(--mut);padding-bottom:2px}
.day{aspect-ratio:1/1.05;border-radius:11px;background:var(--offBg);color:var(--off);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;font-weight:600;border:2px solid transparent}
.day small{font-size:10px;font-weight:500;margin-top:1px}
.day.ok{background:var(--okBg);color:var(--ok)} .day.few{background:var(--warnBg);color:var(--warn)}
.day.sel{border-color:var(--ink)} .day.blank{background:none}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.train{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:12px 14px}
.train.full{opacity:.62}
.btn.rt{background:var(--acc);margin-top:0}a.badge{text-decoration:none}
.t{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.t.arr{font-weight:500;color:var(--mut)}
.st{font-size:13px;color:var(--mut)} .st.alt{color:var(--acc);font-weight:600}
.meta{font-size:12px;color:var(--mut);text-align:right;white-space:nowrap}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--okBg);color:var(--ok)}
.badge.off{background:var(--offBg);color:var(--off)} .badge.warn{background:var(--warnBg);color:var(--warn)} .badge.acc{background:var(--acc);color:#fff}
.leg{display:grid;grid-template-columns:54px 1fr auto;gap:2px 10px;font-size:14px;align-items:baseline}
.leg b{font-variant-numeric:tabular-nums}
.wait{margin:8px 0;padding:6px 10px;border-left:3px dotted var(--mut);font-size:12px;color:var(--mut)}
.sum{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sum .t{font-size:18px}
.wk{padding:0;overflow:hidden}
.wk h3{margin:0;padding:11px 14px;font-size:14px;background:var(--bg);border-bottom:1px solid var(--line)}
.wkrow{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.wkrow:last-child{border-bottom:0}
.wkrow .top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.wkrow .dir{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.pill{font-size:13px;font-variant-numeric:tabular-nums;padding:3px 9px;border-radius:8px;background:var(--okBg);color:var(--ok);font-weight:600}
.pill.alt{background:none;border:1px dashed var(--acc);color:var(--acc)}
.pill[data-jump]{cursor:pointer}
.train[data-href]{cursor:pointer}
.train.hl{outline:3px solid var(--acc);outline-offset:2px;transition:outline-color .3s}
.pill.nw{box-shadow:0 0 0 3px rgba(228,87,46,.4)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
select,input[type=date],input[type=search]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0}
.row2 label{font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:3px;flex:1;text-transform:uppercase;letter-spacing:.05em}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--brand);color:#fff;font-weight:600;margin-top:12px;text-align:center;text-decoration:none}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.msg{text-align:center;color:var(--mut);padding:26px 14px;font-size:14px}
.err{background:var(--warnBg);color:var(--warn);border-color:transparent;font-size:14px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--ok);border-radius:50%;animation:s .8s linear infinite;margin:0 auto 8px}
@keyframes s{to{transform:rotate(360deg)}}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{padding:9px 2px 8px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ok);font-weight:700}
.sheet{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.sheet.on{display:flex}
#picker{z-index:30}
.via{grid-column:1/-1;font-size:12px;color:var(--acc);font-weight:600}
.al{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.al:last-child{border:0}.al button{color:var(--acc);font-weight:700;padding:6px}
.code{font-family:ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:block;margin:8px 0;word-break:break-all;font-size:14px}
ol.steps{padding-left:20px;margin:8px 0;font-size:14px;line-height:1.5}
.sheet .bar{display:flex;gap:8px;padding:12px 14px;align-items:center}
.sheet .bar input{flex:1;font-size:17px}
.sheet .list{overflow:auto;flex:1;padding:0 14px calc(20px + env(safe-area-inset-bottom))}
.opt{display:flex;justify-content:space-between;width:100%;text-align:left;padding:13px 4px;border-bottom:1px solid var(--line);font-size:16px}
.opt small{color:var(--mut)} .opt.sub{padding-left:20px;font-size:14px;color:var(--mut)}
.days{display:flex;gap:6px;margin-top:6px}
.days button{flex:1;padding:9px 0;border-radius:10px;background:var(--offBg);color:var(--off);font-weight:600;font-size:13px}
.days button.on{background:var(--ok);color:#fff}
.lg summary{font-weight:600;cursor:pointer}.lg p{margin:10px 0 0;font-size:13px;line-height:1.5}.lg .badge,.lg .pill{margin-right:6px}
.hero{background:linear-gradient(145deg,#0f2a2e,#1a4d50);color:#eaf6f2;border:0;padding:16px}
.hero h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;opacity:.75;font-weight:600}
.hero .legs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hleg{display:block;text-align:left;background:rgba(255,255,255,.1);border-radius:13px;padding:11px;color:inherit;width:100%}
.hleg .d{font-size:11px;text-transform:uppercase;letter-spacing:.06em;opacity:.72}
.hleg .big{font-size:27px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin:4px 0 3px}
.hleg .s{font-size:12px;opacity:.85;line-height:1.35}
.hleg.none .big{font-size:18px;opacity:.75}
.tl{position:relative;height:31px;margin:9px 6px 0}
.tl::before{content:"";position:absolute;left:-4px;right:-4px;top:9px;height:2px;background:var(--line);border-radius:2px}
.tl i{position:absolute;top:3px;width:14px;height:14px;border-radius:50%;margin-left:-7px;background:var(--ok);border:2px solid var(--card);box-sizing:border-box}
.tl i.alt{background:var(--card);border-color:var(--acc)}
.tl i.full{background:var(--off);opacity:.5;width:8px;height:8px;top:6px;margin-left:-4px;border:0}
.tl i.nw{box-shadow:0 0 0 3px rgba(228,87,46,.4)}
.tl span{position:absolute;top:19px;font-size:9px;color:var(--mut);transform:translateX(-50%)}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-2px;margin-right:6px;background:var(--ok);box-sizing:border-box}
.dot.alt{background:var(--card);border:2px solid var(--acc)}.dot.full{background:var(--off);opacity:.5;width:9px;height:9px}.dot.nw{box-shadow:0 0 0 3px rgba(228,87,46,.4)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.new{font-size:10px;font-weight:800;color:#fff;background:var(--acc);border-radius:99px;padding:2px 6px;margin-left:6px;vertical-align:2px;letter-spacing:.03em;white-space:nowrap}
.age{font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px;opacity:1}
.age.g{background:#1d6b55;color:#d9fff1}.age.o{background:#8a5a00;color:#ffe9bd}.age.r{background:#a3341a;color:#ffe1d8}
.route{position:relative;padding-left:24px}
.route::before{content:"";position:absolute;left:6px;top:10px;bottom:10px;width:2px;background:var(--ok)}
.rstop{position:relative;display:flex;gap:10px;align-items:baseline;font-size:14px;padding:3px 0}
.rstop::before{content:"";position:absolute;left:-23px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--ok);box-sizing:border-box}
.rstop b{font-variant-numeric:tabular-nums;width:46px;flex:none}
.rwait{position:relative;font-size:12px;color:var(--mut);padding:7px 0}
.rwait::before{content:"";position:absolute;left:-20px;top:0;bottom:0;width:6px;background:var(--card)}
.rwait::after{content:"";position:absolute;left:-18px;top:1px;bottom:1px;border-left:2px dotted var(--mut)}
.ical{font-size:12px;color:var(--mut)}
.foot{font-size:11px;color:var(--mut);text-align:center;padding:8px 20px 0;line-height:1.5}
a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1><button data-tab="weekend" aria-label="Retour à l’accueil" style="letter-spacing:inherit;font-weight:inherit">Max<b>Finder</b></button></h1>
    <button class="hbtn" id="demoBtn" hidden>Démo</button>
    <button class="hbtn" data-act="alerts" aria-label="Alertes">🔔 Alertes</button>
    <button class="hbtn" id="refresh" aria-label="Actualiser">↻</button>
  </div>
  <div class="sub" id="subtitle">Places MAX à 0 € · open data SNCF</div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="weekend"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.4 4.2 1.1 6-5.3-3-5.3 3 1.1-6L3.4 9.3l6-.7z"/></svg>Week-ends</button>
  <button data-tab="trajet"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier</button>
  <button data-tab="split"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="6" r="2"/><circle cx="19" cy="12" r="2"/><path d="M6.6 10.8l3.8-3.4M13.6 7.4l3.8 3.4"/></svg>Découpage</button>
  <button data-tab="explore"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>Explorer</button>
</nav>

<div class="sheet" id="picker">
  <div class="bar"><input type="search" id="pickQ" placeholder="Ville ou gare" autocomplete="off"><button class="hbtn" style="background:var(--offBg);color:var(--ink)" id="pickX">Fermer</button></div>
  <div class="list" id="pickList"></div>
</div>
<div class="sheet" id="alertSheet">
  <div class="bar"><h1 style="font-size:18px">Mes alertes</h1><button class="hbtn" style="background:var(--offBg);color:var(--ink)" id="alX">Fermer</button></div>
  <div class="list" id="alBody"></div>
</div>
<div class="sheet" id="favSheet">
  <div class="bar"><h1 style="font-size:18px">Mon trajet habituel</h1><button class="hbtn" style="background:var(--ok);color:#fff" id="favOk">OK</button></div>
  <div class="list" id="favBody"></div>
</div>

<script>
"use strict";
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const HORIZON=30;
const DOW=['dim','lun','mar','mer','jeu','ven','sam'], DOWL=['Dimanche','Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi'];
const MON=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fdate=s=>{const d=parse(s);return DOWL[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const mins=t=>{const[h,m]=String(t).split(':').map(Number);return h*60+m};
const dur=r=>(mins(r.arr)-mins(r.dep)+1440)%1440;
const fdur=m=>Math.floor(m/60)+'h'+pad(m%60);
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const KEEP_UP=new Set(['TGV','CDG2','CDG']);
const pretty=n=>String(n).replace(/\s*\(.*?\)\s*/g,' ').trim().toLowerCase().split(/\s+/)
  .map(w=>KEEP_UP.has(w.toUpperCase())?w.toUpperCase():(['de','du','des','la','le','les','en','sur','et','d'].includes(w)?w:w[0].toUpperCase()+w.slice(1))).join(' ').replace(/^./,c=>c.toUpperCase());
const TWO=new Set(['LA','LE','LES','ST','STE','SAINT','SAINTE','AIX','BOURG','MONT','PORT']);
const cityKey=n=>{const w=String(n).toUpperCase().replace(/\(.*?\)/g,' ').trim().split(/\s+/);return TWO.has(w[0])&&w[1]?w[0]+' '+w[1]:w[0]};
/* Paris regroupe toutes les gares : on précise Gare de Lyon quand l'autre bout est dans le Sud-Est */
const SUD_EST=new Set(['MONTPELLIER','NIMES','SETE','AGDE','BEZIERS','NARBONNE','PERPIGNAN','LUNEL','LYON','VALENCE','MONTELIMAR','ORANGE','AVIGNON','MARSEILLE','AIX EN','TOULON','NICE','CANNES','ANTIBES','GRENOBLE','CHAMBERY','ANNECY','DIJON','MACON','BESANCON']);
const CODE_NAMES={FRPLY:'Paris Gare de Lyon',FRPMO:'Paris Montparnasse',FRPNO:'Paris Gare du Nord',FRPST:'Paris Gare de l’Est',FRPAZ:'Paris Austerlitz',FRPBE:'Paris Bercy',FRPSL:'Paris Saint-Lazare',FRLPD:'Lyon Part-Dieu',FRLPE:'Lyon Perrache',FRLLE:'Lille Europe',FRADJ:'Lille Flandres'};
const stName=(s,other,code)=>/intramuros/i.test(s)&&CODE_NAMES[code]?CODE_NAMES[code]:/^PARIS\b.*intramuros/i.test(s)&&SUD_EST.has(cityKey(other))?'Paris Gare de Lyon':pretty(s);
/* gares voisines : clé de ville -> clés des villes proches */
const NEIGH={
 PARIS:['MASSY','MARNE','AEROPORT','VERSAILLES'],
 MONTPELLIER:['NIMES','SETE','LUNEL','AGDE','BEZIERS','NARBONNE','PERPIGNAN'],
 NIMES:['MONTPELLIER','AVIGNON','LUNEL'], BEZIERS:['AGDE','NARBONNE','SETE'], PERPIGNAN:['NARBONNE'],
 LYON:['MACON','VIENNE','VALENCE'], MARSEILLE:['AIX EN','AVIGNON'], 'AIX EN':['MARSEILLE'], AVIGNON:['NIMES','ORANGE','AIX EN'],
 LILLE:['ARRAS','DOUAI','ROUBAIX','TOURCOING','TGV'], BORDEAUX:['LIBOURNE','ANGOULEME'], NANTES:['ANGERS','ST NAZAIRE'],
 RENNES:['VITRE','LAVAL'], TOULOUSE:['MONTAUBAN'], NICE:['ANTIBES','CANNES'], STRASBOURG:['SAVERNE','COLMAR'],
 TOULON:['MARSEILLE','HYERES'], VALENCE:['MONTELIMAR','LYON'], NARBONNE:['BEZIERS','PERPIGNAN']
};

/* ============ État ============ */
const LS='maxfinder.v1';
let S={tab:'weekend',from:null,to:null,date:iso(today()),alts:true,showFull:false,
  fav:null,favs:null,favI:0,filt:{main:false,eve:false,morn:false},minConn:30,maxWait:180,sort:'arr',notBefore:0,demo:false,alerts:[],topic:'',draft:null};
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||'{}'))}catch(e){}
S.demo=location.hash==='#demo';
if(!Array.isArray(S.favs)||!S.favs.length)S.favs=[S.fav&&S.fav.out?S.fav:{a:null,b:null,out:[5,6],ret:[0]}];
delete S.fav; if(!(S.favI>=0&&S.favI<S.favs.length))S.favI=0;
if(!S.filt)S.filt={main:false,eve:false,morn:false};
if(S.connV!==2){S.connV=2;S.minConn=10}
const FAV=()=>S.favs[S.favI];
if(S.date<iso(today()))S.date=iso(today());
const save=()=>{if(S.demo)return;try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
let STATIONS=[], GROUPS=new Map();

/* ============ Données ============ */
const BASE='https://ressources.data.sncf.com/api/explore/v2.1/catalog/datasets/tgvmax';
const qs=s=>'"'+String(s).replace(/\\/g,'\\\\').replace(/"/g,'\\"')+'"';
const cache=new Map();
let STALE=0;
function pget(k){try{const m=JSON.parse(localStorage.getItem(LS+'.dc')||'{}'),e=m[k];if(!e)return null;return{t:e.t,v:JSON.parse(localStorage.getItem(LS+'.d.'+e.i))}}catch(e){return null}}
function pset(k,v,retry){try{const s=JSON.stringify(v);if(s.length>600000)return;const m=JSON.parse(localStorage.getItem(LS+'.dc')||'{}');let e=m[k];

function demoTrains({origins,dests,from,to,onlyMax}){
  const out=[];

    const ds=iso(d),busy=[0,5,6].includes(d.getDay());

      l.d.forEach((dep,i)=>{

          const len=stops[b][1]-stops[a][1], p=len>150?(busy?.16:.45):(busy?.5:.8);

/* combinaisons de deux tronçons MAX pour un jour donné */
async function combos(from,to,date,o){
  const O=stOf(from),D=stOf(to),q={from:date,to:date,onlyMax:true};
  const [l1,l2]=await Promise.all([trains({origins:O,...q}),trains({dests:D,...q})]);
  const excl=new Set([...O,...D]), direct=countMax(l1.filter(r=>D.includes(r.d)));
  const hub=new Map();
  for(const r of l2){if(excl.has(r.o))continue;const k=cityKey(r.o);(hub.get(k)||hub.set(k,[]).get(k)).push(r)}
  const best=new Map();
  for(const a of l1){
    if(excl.has(a.d)||mins(a.dep)<o.notBefore*60)continue;
    const c=hub.get(cityKey(a.d)); if(!c)continue;
    const aArr=mins(a.dep)+dur(a);
    for(const b of c){
      const known=!!(a.dc&&b.oc), sameSt=known?a.dc===b.oc:a.d===b.o, same=sameSt&&a.no===b.no, intra=!known&&/intramuros/i.test(a.d), far=!sameSt||(!known&&/^PARIS\b/i.test(a.d)), multi=!same&&(far||intra);
      const wait=mins(b.dep)-aArr, need=same?0:far?Math.max(o.minConn,60):o.minConn;
      if(wait<need||wait>o.maxWait)continue;
      const arr=mins(b.dep)+dur(b), it={a,b,wait,same,multi,far,dep:mins(a.dep),arr,total:arr-mins(a.dep)};
      const k=a.no+'|'+a.dep+'|'+a.o+'|'+cityKey(a.d)+'|'+b.d, p=best.get(k);
      if(!p||it.arr<p.arr)best.set(k,it);
    }
  }
  let its=[...best.values()];
  /* pour un même premier train, on écarte les variantes qui arrivent plus d'1 h après la meilleure */
  const bestArr=new Map();for(const x of its){const k=x.a.no+'|'+x.a.dep+'|'+x.a.o;if(!bestArr.has(k)||x.arr<bestArr.get(k))bestArr.set(k,x.arr)}
  its=its.filter(x=>x.arr<=bestArr.get(x.a.no+'|'+x.a.dep+'|'+x.a.o)+60);
  return {its,direct};
}

/* ============ Alertes ============ */
const REPO=(()=>{const m=location.hostname.match(/^(.+)\.github\.io$/),r=location.pathname.split('/')[1];return m&&r?m[1]+'/'+r:'dlevy50-create/maxfinder'})();
const allSt=(p,alts)=>alts?[...p.stations,...altStations(p)]:p.stations.slice();
function alertConfig(){return{topic:S.topic,app:location.origin+location.pathname,alerts:S.alerts.map(a=>({name:a.a.label+' → '+a.b.label,o:allSt(a.a,a.alts),d:allSt(a.b,a.alts),days:a.days,t0:a.t0,t1:a.t1}))}}
function drawAlerts(){
  if(!S.topic){S.topic='maxfinder-'+Array.from({length:12},()=>'abcdefghjkmnpqrstuvwxyz23456789'[Math.floor(Math.random()*31)]).join('')}
  if(!S.alertsInit){S.alertsInit=true;if(!S.alerts.length){const f=FAV();
    if(f.out.length)S.alerts.push({a:f.a,b:f.b,days:f.out.slice(),t0:0,t1:24,alts:true});
    if(f.ret.length)S.alerts.push({a:f.b,b:f.a,days:f.ret.slice(),t0:0,t1:24,alts:true})}}
  if(!S.draft||!validPlace(S.draft.a)||!validPlace(S.draft.b))S.draft={a:S.from,b:S.to,days:[5],t0:0,t1:24,alts:true};
  save();
  const d=S.draft,hours=(cur,from,to)=>{let o='';for(let i=from;i<=to;i++)o+=`<option value="${i}" ${i===cur?'selected':''}>${i} h</option>`;return o};
  const url='https://github.com/'+REPO+'/new/main/alerts?filename='+encodeURIComponent('alertes-'+Date.now()+'.json')+'&value='+encodeURIComponent(JSON.stringify(alertConfig(),null,1));
  $('#alBody').innerHTML=`
   <div class="card"><b>Comment ça marche</b><div class="st" style="margin-top:4px">Chaque matin, après la mise à jour SNCF, vos alertes sont vérifiées et vous recevez une notification pour chaque nouvelle place MAX. Ce n’est pas du temps réel.</div>
    <ol class="steps"><li>Installez l’app gratuite <b>ntfy</b> (App Store) et abonnez-vous au sujet ci-dessous.</li><li>Créez vos alertes.</li><li>Touchez « Enregistrer sur GitHub », puis le bouton vert <b>Commit changes</b>.</li></ol>
    <span class="code" id="topic">${esc(S.topic)}</span><button class="btn ghost" style="margin-top:0" data-al="copy">Copier le sujet ntfy</button></div>
   <h2>Mes alertes (${S.alerts.length})</h2>
   <div class="card">${S.alerts.map((a,i)=>`<div class="al"><span><b>${esc(a.a.label)} → ${esc(a.b.label)}</b><br><span class="st">${a.days.map(x=>DOW[x]).join(', ')} · départ entre ${a.t0} h et ${a.t1} h${a.alts?' · gares voisines':''}</span></span><button data-al="del" data-i="${i}">Supprimer</button></div>`).join('')||'<div class="st">Aucune alerte pour l’instant.</div>'}</div>
   <h2>Nouvelle alerte</h2>
   <div class="card"><button class="pick" data-al="pa"><small>Départ</small><span>${esc(d.a.label)}</span></button><div style="height:8px"></div>
    <button class="pick" data-al="pb"><small>Arrivée</small><span>${esc(d.b.label)}</span></button>
    <div class="st" style="margin-top:12px">Jours</div><div class="days">${[1,2,3,4,5,6,0].map(x=>`<button class="${d.days.includes(x)?'on':''}" data-al="day" data-d="${x}">${DOW[x]}</button>`).join('')}</div>
    <div class="row2"><label>Départ à partir de<select id="alT0">${hours(d.t0,0,23)}</select></label><label>Jusqu’à<select id="alT1">${hours(d.t1,1,24)}</select></label></div>
    <div class="tog"><button class="sw ${d.alts?'on':''}" data-al="alts"></button><span>Inclure les gares voisines</span></div>
    ${d.alts&&(altNames(d.a)||altNames(d.b))?`<div class="alts">${esc([altNames(d.a),altNames(d.b)].filter(Boolean).join(' · '))}</div>`:''}
    <button class="btn" data-al="add">Ajouter cette alerte</button></div>
   <a class="btn rt" style="margin-top:4px" href="${esc(url)}" target="_blank" rel="noopener">Enregistrer sur GitHub ↗</a>
   <div class="foot">À refaire après chaque modification de vos alertes. Le sujet ntfy est visible dans votre dépôt public : quiconque le connaît peut lire ces notifications de trains.</div>`;
}
$('#alX').onclick=()=>$('#alertSheet').classList.remove('on');
$('#alBody').addEventListener('click',e=>{
  const b=e.target.closest('[data-al]');if(!b)return;const k=b.dataset.al,d=S.draft;
  if(k==='pa')return openPicker('alA'); if(k==='pb')return openPicker('alB');
  if(k==='day'){const x=+b.dataset.d,i=d.days.indexOf(x);i<0?d.days.push(x):d.days.splice(i,1);d.days.sort((x,y)=>((x+6)%7)-((y+6)%7))}
  if(k==='alts')d.alts=!d.alts;
  if(k==='del')S.alerts.splice(+b.dataset.i,1);
  if(k==='add'){if(!d.days.length||d.t1<=d.t0){b.textContent=!d.days.length?'Choisissez au moins un jour':'Plage horaire invalide';return}
    S.alerts.push(JSON.parse(JSON.stringify(d)))}
  if(k==='copy'){navigator.clipboard&&navigator.clipboard.writeText(S.topic).then(()=>{b.textContent='Copié ✓'}).catch(()=>{b.textContent='Copie impossible : recopiez-le à la main'});return}
  drawAlerts();
});
$('#alBody').addEventListener('change',e=>{if(e.target.id==='alT0')S.draft.t0=+e.target.value;if(e.target.id==='alT1')S.draft.t1=+e.target.value;save()});

/* ============ Événements ============ */
document.addEventListener('click',e=>{
  const card=e.target.closest('.train[data-href]');
  if(card&&!e.target.closest('a,button')){const a=document.createElement('a');a.href=card.dataset.href;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();return}
  const t=e.target.closest('[data-jump],[data-tab],[data-pick],[data-act],[data-date],[data-go],[data-dest],[data-favi],[data-filt]');
  if(!t||t.closest('.sheet'))return;
  const d=t.dataset;
  if(d.jump){JUMP=d.jump;const g=t.closest('[data-go]');
    if(!g)return doJump();
    const o=JSON.parse(g.dataset.go);S.date=o.ds;S.from=o.rev?FAV().b:FAV().a;S.to=o.rev?FAV().a:FAV().b;S.hideFull=false;S.filt={main:false,eve:false,morn:false};S.tab='trajet';return render()}
  if(d.tab){S.tab=d.tab;window.scrollTo(0,0);return render()}
  if(d.pick)return openPicker(d.pick);
  if(d.favi){S.favI=+d.favi;return render()}
  if(d.filt){S.filt[d.filt]=!S.filt[d.filt];return render()}
  if(d.act==='favadd'){S.favs.push({a:S.from,b:S.to,out:[5],ret:[0]});S.favI=S.favs.length-1;drawFav();return $('#favSheet').classList.add('on')}
  if(d.date){S.date=d.date;return render()}
  if(d.go){const g=JSON.parse(d.go);S.date=g.ds;S.from=g.rev?FAV().b:FAV().a;S.to=g.rev?FAV().a:FAV().b;S.tab='trajet';window.scrollTo(0,0);return render()}
  if(d.dest){S.to=groupPlace(d.dest)||S.to;S.tab='trajet';window.scrollTo(0,0);return render()}
  if(d.act==='swap'){[S.from,S.to]=[S.to,S.from];return render()}
  if(d.act==='alts'){S.alts=!S.alts;return render()}
  if(d.act==='full'){S.hideFull=!S.hideFull;return render()}
  if(d.act==='alerts'){drawAlerts();return $('#alertSheet').classList.add('on')}
  if(d.act==='fav'){drawFav();return $('#favSheet').classList.add('on')}
  if(d.act==='demo'){location.hash='#demo';return location.reload()}
});
document.addEventListener('change',e=>{
  const m={sDate:['date',String],sMin:['minConn',Number],sMax:['maxWait',Number],sSort:['sort',String],sNot:['notBefore',Number]}[e.target.id];
  if(!m||!e.target.value)return; S[m[0]]=m[1](e.target.value); render();
});
const hardRefresh=()=>{cache.clear();FRESH=0;freshAsked=false;if(S.date<iso(today()))S.date=iso(today());render()};
$('#refresh').onclick=hardRefresh;
/* l'iPhone garde l'appli en mémoire : au retour au premier plan, on recharge si l'affichage a plus de 10 min */
let lastRender=Date.now();
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastRender>10*60e3&&!document.querySelector('.sheet.on'))hardRefresh()});
window.addEventListener('pageshow',e=>{if(e.persisted)hardRefresh()});
$('#demoBtn').onclick=()=>{history.replaceState(null,'',location.pathname);location.reload()};
render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
