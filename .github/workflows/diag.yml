name: Diagnostic données SNCF
on:
  push:
    branches: [main]
    paths: ['diag/go.txt']
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/diag.mjs
      - run: |
          git config user.name "maxfinder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add diag
          git commit -m "Diagnostic : résultat" && git pull --rebase && git push
