name: Alertes MaxFinder
on:
  schedule:
    # Toutes les heures (UTC) en journée : la SNCF publie à heure variable
    - cron: '10 4-20 * * *'
  push:
    branches: [main]
    paths: ['alerts/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: alertes
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fresh.mjs
      - run: node scripts/check.mjs
      - name: Enregistrer l'état
        run: |
          git config user.name "maxfinder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A alerts state
          git diff --cached --quiet && exit 0
          git commit -m "Alertes : mise à jour de l'état"
          for i in 1 2 3 4; do git pull --rebase origin main && git push && exit 0; sleep 5; done; exit 1
