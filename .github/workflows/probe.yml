name: Sonde simulateur
on:
  push:
    branches: [main]
    paths: ['probe/go.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/probe.mjs
      - run: |
          git config user.name "maxfinder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add probe
          git commit -m "Sonde : résultat" && git push
